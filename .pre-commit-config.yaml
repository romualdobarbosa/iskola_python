repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
      - id: iskola-validar
        name: iskola validar
        entry: uv run iskola validar
        language: system
        pass_filenames: false
        always_run: true
